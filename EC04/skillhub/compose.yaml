# =====================================================================
# Orchestration SkillHub — Docker Compose
#
# Trois services : l'application, PostgreSQL (donnees metier) et MongoDB
# (feedbacks et journal de visites).
#
# Choix structurants :
#   - deux reseaux : seule l'application est joignable de l'exterieur,
#     les bases vivent sur un reseau interne sans acces Internet ;
#   - une sonde de sante par service : l'application n'est declaree
#     disponible que si elle repond vraiment, pas seulement si le
#     processus est lance ;
#   - redemarrage automatique : un conteneur qui tombe repart seul ;
#   - limites memoire et processeur : un service emballe ne peut pas
#     assecher la machine hote ;
#   - aucune valeur sensible en clair : tout vient du fichier .env,
#     documente par .env.example et jamais versionne.
# =====================================================================

services:
  # -------------------------------------------------------------------
  # Application SkillHub (Symfony 8.4 + FrankenPHP)
  #
  # Aucun port fixe unique : la plage permet de lancer plusieurs
  # instances en parallele (docker compose up --scale app=3).
  # -------------------------------------------------------------------
  app:
    build: .
    image: ghcr.io/samilazaar/skillhub-app:latest
    ports:
      - "8080-8085:80"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?absent - copier le modele .env.example vers .env}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      MONGODB_URL: "mongodb://mongodb:27017"
      MONGODB_DB: "${MONGODB_DB:-app}"
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  # -------------------------------------------------------------------
  # PostgreSQL — donnees metier. Reseau interne uniquement.
  # -------------------------------------------------------------------
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absent - copier le modele .env.example vers .env}"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  # -------------------------------------------------------------------
  # MongoDB — feedbacks et journal de visites. Reseau interne uniquement.
  # -------------------------------------------------------------------
  mongodb:
    image: mongo:7
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mongodb_data:/data/db:rw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

networks:
  # Seul reseau relie a l'exterieur : uniquement l'application y figure.
  frontend:
  # internal:true = aucune route vers l'exterieur. Meme compromises, les
  # bases ne peuvent ni etre jointes depuis Internet ni exfiltrer vers lui.
  backend:
    internal: true

volumes:
  database_data:
  mongodb_data:
