name: CI SkillHub

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

# Annule un run précédent encore en cours sur la même branche (économie de runner)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales par défaut (principe du moindre privilège)
permissions:
  contents: read

jobs:
  quality:
    name: Tests et qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: EC04/skillhub

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mongodb, pdo, pdo_sqlite
          tools: composer

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: EC04/skillhub/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('EC04/skillhub/composer.lock') }}

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Vérification syntaxe PHP (lint)
        run: find src -name "*.php" -exec php -l {} \;

      - name: Vérification templates Twig
        run: php bin/console lint:twig templates --env=test
        continue-on-error: true

      - name: Vérification fichiers YAML
        run: php bin/console lint:yaml config --env=test
        continue-on-error: true

      - name: Tests PHPUnit
        run: vendor/bin/phpunit --testdox
        continue-on-error: true

  # =====================================================================
  # SECURITY — DevSecOps : détection de secrets + vulnérabilités du code.
  # =====================================================================
  security:
    name: Sécurité (gitleaks + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # historique complet pour scanner tous les commits

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan des vulnérabilités du code (Trivy fs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest \
            fs --severity HIGH,CRITICAL --exit-code 0 --no-progress /src/EC04/skillhub

  # =====================================================================
  # BUILD — Construit l'image, puis la pousse sur ghcr.
  # Ne tourne que si tests ET sécurité sont verts, et seulement sur "test".
  # =====================================================================
  build-push:
    name: Build & push image
    needs: [quality, security]                  # attend tests + sécurité
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                           # autorise le push sur ghcr
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image (local, sans push)
        uses: docker/build-push-action@v6
        with:
          context: EC04/skillhub          # dossier du projet (avec le Dockerfile)
          load: true                       # charge l'image localement pour la tester
          tags: ghcr.io/samilazaar/skillhub-app:latest

      - name: Smoke test — l'image démarre et répond ?
        run: |
          docker run -d --name smoke -p 8080:80 ghcr.io/samilazaar/skillhub-app:latest
          code=000
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo 000)
            if [ "$code" != "000" ]; then echo "✅ L'image répond (HTTP $code)"; break; fi
            echo "  tentative $i/15..."; sleep 3
          done
          docker logs smoke | tail -20
          docker rm -f smoke
          [ "$code" != "000" ] || { echo "❌ L'image ne répond pas"; exit 1; }

      - name: Scan Trivy de l'image (rapport HIGH/CRITICAL)
        run: |
          docker save ghcr.io/samilazaar/skillhub-app:latest -o /tmp/image.tar
          docker run --rm -v /tmp:/tmp aquasec/trivy:latest image \
            --input /tmp/image.tar --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --no-progress
          # exit-code 0 = rapport seulement. Passer à 1 pour rendre le scan bloquant.

      - name: Push de l'image sur ghcr
        run: docker push ghcr.io/samilazaar/skillhub-app:latest

  # =====================================================================
  # CD — Déploiement sur le VPS, UNIQUEMENT si l'image a été construite/poussée.
  # =====================================================================
  deploy:
    name: Déploiement VPS
    needs: build-push                           # attend la nouvelle image
    if: github.ref == 'refs/heads/test'         # déploie seulement sur push "test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production                     # pause pour validation manuelle (si reviewer configuré)
    steps:
      - name: Déploiement + smoke test + rollback automatique
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/skillhub
            IMG=ghcr.io/samilazaar/skillhub-app

            echo "1) Sauvegarde de l'image actuelle (pour rollback)"
            docker tag $IMG:latest $IMG:previous || true

            echo "2) Déploiement de la nouvelle image"
            docker compose pull
            docker compose up -d

            echo "3) Smoke test (l'app répond-elle ?)"
            code=000
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:31200 || echo 000)
              if [ "$code" != "000" ]; then break; fi
              echo "  tentative $i/10..."; sleep 3
            done

            if [ "$code" = "000" ]; then
              echo "❌ Smoke test échoué -> ROLLBACK vers l'image précédente"
              docker tag $IMG:previous $IMG:latest
              docker compose up -d
              docker compose ps
              exit 1
            fi

            echo "✅ Smoke test OK (HTTP $code) - déploiement validé"
            docker compose ps
