# =====================================================================
# CI — Chef d'orchestre du pipeline SkillHub.
#
# Ce fichier contient les tests, puis appelle les deux autres pipelines :
#   1. ci.yml        (ici)  -> tests et qualité du code
#   2. security.yml         -> secrets et vulnérabilités
#   3. cd.yml               -> construction de l'image et déploiement
#
# Chaque étape n'est lancée que si la précédente est verte.
# =====================================================================
name: CI SkillHub

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

# Annule un run précédent encore en cours sur la même branche (économie de runner)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales par défaut (principe du moindre privilège)
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # 1. QUALITÉ — le code compile-t-il et les tests passent-ils ?
  #    Aucun "continue-on-error" ici : un test rouge arrête le pipeline.
  # -------------------------------------------------------------------
  quality:
    name: Tests et qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: EC04/skillhub

    # Base de données éphémère, détruite avec le runner. Sans elle, le test
    # d'intégration GET /api/workshops échouait faute de connexion : le
    # pipeline était rouge en permanence et ne prouvait plus rien.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Le job attend que la base réponde avant de démarrer les étapes.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Doctrine suffixe le nom de la base par _test en environnement de test :
      # la base réellement utilisée sera app_test.
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mongodb, pdo, pdo_pgsql, pdo_sqlite
          tools: composer

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: EC04/skillhub/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('EC04/skillhub/composer.lock') }}

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      # xargs propage le code d'erreur, contrairement à "find -exec" :
      # une erreur de syntaxe fait bien échouer l'étape.
      - name: Vérification syntaxe PHP (lint)
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Vérification templates Twig
        run: php bin/console lint:twig templates --env=test

      - name: Vérification fichiers YAML
        run: php bin/console lint:yaml config --env=test

      # Analyse statique BLOQUANTE : PHPStan relit le code sans l'exécuter.
      # Contrairement au lint (qui ne voit que la syntaxe), il détecte les
      # appels à des méthodes inexistantes. Un échec ici arrête le pipeline
      # et empêche la fusion vers main.
      #
      # Placée avant la préparation de la base : elle ne demande aucune
      # infrastructure, autant échouer tout de suite si le code est fautif.
      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Le schéma est construit à partir des entités, pas des migrations :
      # la table sessions, ajoutée après la dernière migration, en fait partie.
      - name: Préparation de la base de test
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:schema:create --env=test

      - name: Tests PHPUnit
        run: vendor/bin/phpunit --testdox

  # -------------------------------------------------------------------
  # 2. SÉCURITÉ — pipeline séparé (security.yml), appelé si les tests passent.
  # -------------------------------------------------------------------
  security:
    name: Sécurité
    needs: quality
    uses: ./.github/workflows/security.yml
    secrets: inherit
    permissions:
      contents: read

  # -------------------------------------------------------------------
  # 3. LIVRAISON — pipeline séparé (cd.yml), uniquement sur la branche "test"
  #    et uniquement si tests ET sécurité sont verts.
  # -------------------------------------------------------------------
  cd:
    name: Build & déploiement
    needs: [quality, security]
    if: github.ref == 'refs/heads/test'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write       # push de l'image sur ghcr
      id-token: write       # signature cosign sans clé
