name: CI SkillHub

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

# Annule un run précédent encore en cours sur la même branche (économie de runner)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales par défaut (principe du moindre privilège)
permissions:
  contents: read

jobs:
  quality:
    name: Tests et qualité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: EC04/skillhub

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mongodb, pdo, pdo_sqlite
          tools: composer

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: EC04/skillhub/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('EC04/skillhub/composer.lock') }}

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Vérification syntaxe PHP (lint)
        run: find src -name "*.php" -exec php -l {} \;

      - name: Vérification templates Twig
        run: php bin/console lint:twig templates --env=test
        continue-on-error: true

      - name: Vérification fichiers YAML
        run: php bin/console lint:yaml config --env=test
        continue-on-error: true

      - name: Tests PHPUnit
        run: vendor/bin/phpunit --testdox
        continue-on-error: true

  # =====================================================================
  # SECURITY — DevSecOps : détection de secrets + vulnérabilités du code.
  # =====================================================================
  security:
    name: Sécurité (gitleaks + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # historique complet pour scanner tous les commits

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan des vulnérabilités du code (Trivy fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: EC04/skillhub
          severity: HIGH,CRITICAL
          exit-code: '0'            # rapport seulement ici (bloquant sur l'image en étape 2)
          format: table

  # =====================================================================
  # BUILD — Construit l'image, puis la pousse sur ghcr.
  # Ne tourne que si tests ET sécurité sont verts, et seulement sur "test".
  # =====================================================================
  build-push:
    name: Build & push image
    needs: [quality, security]                  # attend tests + sécurité
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                           # autorise le push sur ghcr
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: EC04/skillhub          # dossier du projet (avec le Dockerfile)
          push: true
          tags: ghcr.io/samilazaar/skillhub-app:latest

  # =====================================================================
  # CD — Déploiement sur le VPS, UNIQUEMENT si l'image a été construite/poussée.
  # =====================================================================
  deploy:
    name: Déploiement VPS
    needs: build-push                           # attend la nouvelle image
    if: github.ref == 'refs/heads/test'         # déploie seulement sur push "test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Relancer l'app sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/skillhub
            docker compose pull        # récupère les dernières images
            docker compose up -d        # relance l'app proprement
            docker compose ps           # affiche l'état dans les logs Actions
